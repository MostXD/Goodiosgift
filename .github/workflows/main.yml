name: Build iOS Game
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Corona/Solar2D CLI
        run: |
          curl -L -o solar2d.dmg https://github.com
          hdiutil attach solar2d.dmg
          sudo cp -R /Volumes/Solar2D/Solar2D.app /Applications/
          hdiutil detach /Volumes/Solar2D

      - name: Build IPA
        run: |
          /Applications/Solar2D.app/Contents/Resources/carat build \
            --platform iphone \
            --project Project/ \
            --output Build/
