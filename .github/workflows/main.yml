name: Build iOS Game
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Solar2D
        uses: solar2d/setup-solar2d@v1
        with:
          version: 'latest'

      - name: Build IPA
        run: |
          mkdir -p Build
          solar2d-cli build \
            --platform iphone \
            --project Project/ \
            --output Build/

      - name: Upload Finished Game
        uses: actions/upload-artifact@v4
        with:
          name: my-ios-game
          path: Build/
